[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-collector-backend"
version = "1.0.0"
description = "Backend-only API for authorized Douyin and Weibo media archiving"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.19.0",
    "fastapi>=0.115.0",
    "gmssl>=3.2.2",
    "imageio-ffmpeg==0.6.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
person-filter = [
    "numpy>=1.24.0,<3.0.0",
    "opencv-python-headless>=4.8.0,<4.11.0",
    "onnxruntime>=1.16.0,<1.18.0",
]
transcribe = ["openai-whisper>=20231117"]
dev = [
    "build>=1.2.0",
    "httpx>=0.27.0",
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.0",
]
[project.scripts]
media-collector-api = "server.cli:main"
douyin-dl = "cli.main:main"

[tool.setuptools.packages.find]
include = [
    "auth*",
    "cli*",
    "config*",
    "control*",
    "core*",
    "server*",
    "storage*",
    "tools*",
    "utils*",
    "weibo_support*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
